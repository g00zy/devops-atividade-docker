name: CI-CD

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI - Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar projeto
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test --no-build --configuration Release

  cd:
    name: CD - Preparar artefato
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar aplicacao
        run: dotnet publish src/DevOpsAtividade.Api/DevOpsAtividade.Api.csproj --configuration Release --output ./publish

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: devops-api
          path: ./publish